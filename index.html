<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centauri</title>
    
    <link id="favicon" rel="icon" type="image/png" href="https://github.com/1ucent/centauri/blob/main/assets/favicon.png?raw=true">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@400;500&display=swap');
        
        body {
            font-family: 'Darker Grotesque', sans-serif;
            background: #ffffff;
            color: #111111;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 text-center select-none">

    <div class="flex flex-col items-center w-full max-w-4xl mx-auto space-y-8">
        
        <div class="space-y-4">
            <h1 class="text-4xl md:text-[3.5rem] font-normal tracking-tight leading-tight text-neutral-900">
                Coming to Maryland late 2026.
            </h1>
            <p class="text-3xl md:text-[2.75rem] font-normal text-neutral-900 leading-tight">
                Stay tuned!
            </p>
        </div>

        <div class="pt-8 pb-4 flex items-center justify-center">
            <img src="https://github.com/1ucent/centauri/blob/main/assets/banner.png?raw=true" 
                 alt="Centauri" 
                 class="h-12 md:h-16 object-contain">
        </div>

    </div>

    <script>
        // Uses a color filter to dynamically turn the PNG favicon white in dark mode
        const favicon = document.getElementById('favicon');
        const originalHref = favicon.href;

        function applyFaviconFilter() {
            const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (!isDarkMode) {
                // Restore original black PNG for light mode
                favicon.href = originalHref;
                return;
            }

            const img = new Image();
            img.crossOrigin = "anonymous"; 
            img.src = originalHref;
            
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                
                // Apply the exact color filter requested
                ctx.filter = 'invert(100%)';
                ctx.drawImage(img, 0, 0);
                
                try {
                    // Update the favicon with the filtered output
                    favicon.href = canvas.toDataURL('image/png');
                } catch (e) {
                    console.warn("CORS prevented applying the color filter to the favicon.", e);
                }
            };
        }

        // Listen for system theme changes and run on load
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyFaviconFilter);
        applyFaviconFilter();
    </script>
</body>
</html>
