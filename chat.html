<!DOCTYPE html>
<html>
<head>
  <title>Global Chat</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; }
    #messages { height: 400px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
    .msg { margin: 4px 0; }
    .msg b { color: #0066cc; }
    form { display: flex; gap: 8px; }
    input[type=text] { flex: 1; padding: 8px; }
    button { padding: 8px 16px; }
  </style>
</head>
<body>
  <h2>Global Chat</h2>
  <p><label>Name: <input type="text" id="name" placeholder="Your name"></label></p>
  <div id="messages"></div>
  <form id="chat-form">
    <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off">
    <button type="submit">Send</button>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabase = supabase.createClient(
      "https://rwqutgkgywrwfxugtyns.supabase.co",
      "sb_publishable_yDdbcpyCnjQgbeWN1O98Ag_i9iMNNT7"
    );

    const channel = supabase.channel("global-chat", {
      config: { broadcast: { self: true } }
    });

    channel.on("broadcast", { event: "message" }, ({ payload }) => {
      const div = document.createElement("div");
      div.className = "msg";
      div.innerHTML = `<b>${escapeHtml(payload.name)}:</b> ${escapeHtml(payload.text)}`;
      const box = document.getElementById("messages");
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }).subscribe();

    let name = "";
    document.getElementById("name").addEventListener("change", e => {
      name = e.target.value || "Anonymous";
    });

    document.getElementById("chat-form").addEventListener("submit", e => {
      e.preventDefault();
      const input = document.getElementById("msg-input");
      const text = input.value.trim();
      if (!text) return;
      channel.send({
        type: "broadcast",
        event: "message",
        payload: { name: name || "Anonymous", text }
      });
      input.value = "";
    });

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }
  </script>
</body>
</html>
